services:
  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    container_name: ai-kubernetes-agent-hindsight
    restart: unless-stopped
    shm_size: 1gb
    # Hindsight is isolated to the private internal network (no public host exposure)
    expose:
      - "8888"
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=${HINDSIGHT_API_LLM_PROVIDER:-mock}
      - HINDSIGHT_API_LLM_API_KEY=${GEMINI_API_KEY:-}
      - HINDSIGHT_API_LLM_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - HINDSIGHT_API_WORKER_ID=ai-kubernetes-agent-hindsight
    volumes:
      - hindsight-data:/home/hindsight/.pg0
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8888/health', timeout=4).getcode() == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai-kubernetes-agent-backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - KUBECONFIG_PATH=${KUBECONFIG_PATH:-}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - HINDSIGHT_URL=http://hindsight:8888
    volumes:
      - ~/.kube:/root/.kube:ro
    depends_on:
      hindsight:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai-kubernetes-agent-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NEXT_PUBLIC_INSFORGE_URL=${NEXT_PUBLIC_INSFORGE_URL:-https://mucsd7yw.us-east.insforge.app}
      - NEXT_PUBLIC_INSFORGE_ANON_KEY=${NEXT_PUBLIC_INSFORGE_ANON_KEY:-anon_57cbe317689f3e724ced0051c10d088eab9ddc1123ce564702735a7dcb764eb8}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  edge-agent:
    build:
      context: ./edge-agent
      dockerfile: Dockerfile
    container_name: ai-kubernetes-agent-edge
    ports:
      - "8081:8081"
    environment:
      - CLUSTERSAGE_AGENT_ID=edge-agent-node-01
      - CLUSTERSAGE_ORG_ID=org_enterprise_primary
      - CLUSTERSAGE_CLUSTER_ID=production-us-east-1
      - CLUSTERSAGE_CLUSTER_NAME=Production K8s US-East
      - CLUSTERSAGE_CLOUD_URL=http://backend:8000/api/v1/agent
      - CLUSTERSAGE_AGENT_KEY=cs_agent_key_prod_sec_9941a8b
      - HINDSIGHT_LOCAL_URL=http://hindsight:8888
      - POLL_INTERVAL_SECONDS=30
      - FAIL_CLOSED_ON_PRIVACY_ERROR=true
    volumes:
      - edge-agent-data:/app/data
    depends_on:
      backend:
        condition: service_healthy
      hindsight:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  hindsight-data:
  edge-agent-data:
