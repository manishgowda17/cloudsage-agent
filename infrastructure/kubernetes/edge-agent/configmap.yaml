apiVersion: v1
kind: ConfigMap
metadata:
  name: clustersage-edge-agent-config
  namespace: clustersage
  labels:
    app.kubernetes.io/name: clustersage-edge-agent
data:
  CLUSTERSAGE_ORG_ID: "org_enterprise_primary"
  CLUSTERSAGE_CLUSTER_ID: "production-us-east-1"
  CLUSTERSAGE_CLUSTER_NAME: "Production K8s US-East"
  CLUSTERSAGE_CLOUD_URL: "https://api.clustersage.io/api/v1/agent"
  HINDSIGHT_LOCAL_URL: "http://hindsight.clustersage.svc.cluster.local:8888"
  POLL_INTERVAL_SECONDS: "30"
  HEARTBEAT_INTERVAL_SECONDS: "60"
  FAIL_CLOSED_ON_PRIVACY_ERROR: "true"
