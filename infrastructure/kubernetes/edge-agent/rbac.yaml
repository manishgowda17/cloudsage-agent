apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clustersage-edge-agent-role
  labels:
    app.kubernetes.io/name: clustersage-edge-agent
rules:
  # Least-privilege read-only permissions for telemetry collection
  - apiGroups: [""]
    resources: ["pods", "nodes", "events", "namespaces", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clustersage-edge-agent-binding
  labels:
    app.kubernetes.io/name: clustersage-edge-agent
subjects:
  - kind: ServiceAccount
    name: clustersage-edge-agent
    namespace: clustersage
roleRef:
  kind: ClusterRole
  name: clustersage-edge-agent-role
  apiGroup: rbac.authorization.k8s.io
